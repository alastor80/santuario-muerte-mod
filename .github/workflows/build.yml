name: Compilar Santuario de la Muerte

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # permite compilarlo a mano desde la pestaña Actions (sirve desde el celular)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Compilar
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: santuario-muerte-jar
          path: build/libs/*.jar
          if-no-files-found: error
