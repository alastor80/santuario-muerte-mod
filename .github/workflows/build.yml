name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Compilar
        run: |
          if [ -f build.gradle ]; then
            DIR=.
          else
            mkdir -p proj
            for z in ./*.zip; do unzip -o "$z" -d proj; done
            B=$(find proj -name build.gradle | head -1)
            if [ -z "$B" ]; then
              echo "No se encontró build.gradle"
              exit 1
            fi
            DIR=$(dirname "$B")
          fi
          cd "$DIR"
          echo "PROJECT_DIR=$(pwd)" >> "$GITHUB_ENV"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
